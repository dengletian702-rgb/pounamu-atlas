<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Route — Pounamu Atlas</title>
  <meta name="description" content="One New Zealand route stop by stop on the map, with the day's shape, a checklist and official sources. 绿石之地 · 中英双语线路攻略。">
  <meta name="theme-color" content="#1d1e20">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/v3.css">
  <link rel="stylesheet" href="/css/v4.css">
  <link rel="stylesheet" href="/css/stone.css">
  <script type="module" src="/js/route.js"></script>
</head>
<body class="rp-body">
  <a class="skip" href="#rp-guide">Skip to the guide</a>

  <nav class="bar solid rp-bar" aria-label="Primary">
    <a class="bar-mark" href="/"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c6 4 10 9 10 15a10 10 0 0 1-20 0C6 12 10 7 16 3Z"/><path d="M16 9c-2.6 3-4 6-4 9a4 4 0 0 0 8 0c0-3-1.4-6-4-9Z" class="mark-in"/></svg><span id="rp-wordmark">Pounamu Atlas</span></a>
    <a class="rp-back" id="rp-back" href="/#routes">All routes</a>
    <button class="rp-swap" id="rp-swap" type="button" aria-keyshortcuts="S"><span aria-hidden="true">⇄</span><span class="vh" id="rp-swap-t">Swap map and guide</span></button>
    <button class="lang" id="lang" type="button" lang="zh-Hans">中文</button>
  </nav>

  <div class="rp-tabs" id="rp-tabs" role="tablist">
    <button type="button" role="tab" id="tab-guide" aria-controls="rp-guide" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-map" aria-controls="rp-map" aria-selected="false"></button>
  </div>

  <main class="rp" id="rp">
    <section class="rp-map" id="rp-map" aria-label="Map">
      <div class="map-holder" id="map"></div>
      <div class="player" id="player">
        <button type="button" class="pl-play" id="pl-play"></button>
        <div class="pl-track">
          <div class="pl-read"><b id="pl-km">0</b><span id="pl-of"></span><span class="pl-day" id="pl-day"></span></div>
          <div class="prog"><span class="prog-fill" id="prog"></span></div>
        </div>
        <button type="button" class="pl-btn" id="pl-rate"></button>
        <span class="pl-zoom">
          <button type="button" class="pl-btn" id="pl-out"><span aria-hidden="true">−</span><span class="vh"></span></button>
          <button type="button" class="pl-btn" id="pl-home"><span aria-hidden="true">⤢</span><span class="vh"></span></button>
          <button type="button" class="pl-btn" id="pl-in"><span aria-hidden="true">+</span><span class="vh"></span></button>
        </span>
        <button type="button" class="pl-btn pl-places" id="pl-places" aria-pressed="true"></button>
      </div>
      <p class="rp-credit" id="rp-credit"></p>
    </section>

    <article class="rp-guide" id="rp-guide" tabindex="-1"></article>
  </main>
  <noscript><p class="noscript">This guide needs JavaScript for the map. 本页面的地图需要启用 JavaScript。<a href="/">Home / 首页</a></p></noscript>
</body>
</html>
